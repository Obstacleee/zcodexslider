[package]
name = "zslice"
version = "0.1.0"
edition = "2021"
description = "FDM slicer producing Zortrax .zcodex2 files (M200 Plus oriented)"

[dependencies]
zcodex2 = { path = "../zcodex2" }
clipper2-rust = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.18"
rsa = "0.9"
sha1 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"
rayon = "1"
