# Profils de départ pour PrusaSlicer / SuperSlicer : Zortrax M200 Plus + Z-PLA, buse 0.4 mm.
# À importer via  Fichier > Importer > Importer la configuration groupée (« Import Config Bundle »).
# NON testé dans PrusaSlicer : relis les valeurs après l'import.
#
# IMPORTANT : remplace CHEMIN_VERS_ZTOOL ci-dessous par le chemin réel de ztool.exe
# (dans le profil [print:...], ligne post_process), ou modifie-le dans
# Réglages d'impression > Sorties > Scripts de post-traitement.

[printer:Zortrax M200 Plus 0.4]
printer_technology = FFF
bed_shape = 0x0,200x0,200x200,0x200
max_print_height = 180
z_offset = 0
nozzle_diameter = 0.4
gcode_flavor = marlin
use_relative_e_distances = 0
use_firmware_retraction = 0
retract_length = 0.8
retract_speed = 60
retract_lift = 0.4
retract_before_travel = 3
retract_layer_change = 1
wipe = 0
extruder_colour = ""
single_extruder_multi_material = 0
host_type = octoprint
start_gcode = M140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG90\nM82\nG92 E0
end_gcode = M104 S0\nM140 S0\nG91\nG1 Z10 F600\nG90\nG28 X Y\nM84
before_layer_gcode =
layer_gcode =
toolchange_gcode =
pause_print_gcode =
printer_notes = Zortrax M200 Plus - profil généré pour le convertisseur ztool (.zcodex2)

[filament:Z-PLA M200 Plus]
filament_diameter = 1.75
filament_type = PLA
temperature = 210
first_layer_temperature = 210
bed_temperature = 30
first_layer_bed_temperature = 30
extrusion_multiplier = 1
filament_density = 1.24
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 2
fan_always_on = 1
cooling = 1
slowdown_below_layer_time = 8
min_print_speed = 12
filament_notes = Valeurs mesurées sur un fichier Z-Suite (Z-PLA, M200 Plus)

[print:Zortrax M200 Plus 0.15 mm]
layer_height = 0.15
first_layer_height = 0.26
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 20%
fill_pattern = rectilinear
external_perimeters_first = 1
perimeter_speed = 20
external_perimeter_speed = 20
infill_speed = 70
solid_infill_speed = 35
top_solid_infill_speed = 35
first_layer_speed = 25
bridge_speed = 10
travel_speed = 200
gap_fill_speed = 20
support_material = 0
raft_layers = 0
skirts = 0
brim_width = 0
extrusion_width = 0.45
external_perimeter_extrusion_width = 0.46
infill_extrusion_width = 0.6
solid_infill_extrusion_width = 0.5
top_infill_extrusion_width = 0.5
first_layer_extrusion_width = 0.5
gcode_comments = 1
gcode_label_objects = 0
post_process = "CHEMIN_VERS_ZTOOL\ztool.exe" to-zcodex2

[presets]
print = Zortrax M200 Plus 0.15 mm
filament = Z-PLA M200 Plus
printer = Zortrax M200 Plus 0.4
